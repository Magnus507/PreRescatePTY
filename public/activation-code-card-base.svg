      <stop offset="1" stop-color="#11151b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".38" cy=".42" r=".8">
      <stop offset="0" stop-color="#20252c" stop-opacity=".48"/>
      <stop offset=".65" stop-color="#0e1116" stop-opacity=".08"/>
      <stop offset="1" stop-color="#05070a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3038"/>
      <stop offset=".55" stop-color="#d9000c"/>
      <stop offset="1" stop-color="#7d0008"/>
    </linearGradient>
    <linearGradient id="blueEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f67c9"/>
      <stop offset=".55" stop-color="#083a76"/>
