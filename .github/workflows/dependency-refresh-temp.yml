name: Dependency Refresh Temp

on:
  push:
    branches:
      - release/final-hardening-2026-08-31

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/final-hardening-2026-08-31

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Upgrade audited direct dependencies
        run: |
          npm install --package-lock-only --save \
            next@15.5.21 \
            next-auth@4.24.15 \
            sharp@0.35.4 \
            postcss@8.5.23

      - name: Apply Prisma deepmerge security override
        run: |
          npm pkg set 'overrides.deepmerge-ts=^8.0.1'
          npm install --package-lock-only

      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only --omit=dev || true

      - name: Show production audit after refresh
        run: npm audit --omit=dev || true

      - name: Commit refreshed dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency metadata changes to commit."
            exit 0
          fi
          git commit -m "fix(security): refresh vulnerable production dependencies"
          git push origin HEAD:release/final-hardening-2026-08-31
