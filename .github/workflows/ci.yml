name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: prerescate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d prerescate_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/prerescate_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/prerescate_ci
      DATABASE_URL_TEST: postgresql://ci:ci@localhost:5432/prerescate_ci
      NEXTAUTH_SECRET: ci-only-not-a-production-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma
        run: npx prisma validate

      - name: Prepare integration database
        run: npx prisma db push --skip-generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Coverage
        run: npm run test:coverage -- --run

      - name: Build
        run: npm run build
